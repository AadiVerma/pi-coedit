<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="pi-coedit — human vs AI edit accountability">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF1F7"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63A9F2"/>
      <stop offset="1" stop-color="#3B7CC4"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AC72E8"/>
      <stop offset="1" stop-color="#7E3FB8"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5B45C"/>
      <stop offset="1" stop-color="#DD7E24"/>
    </linearGradient>
    <linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle cx="80" cy="40" r="280" fill="#4A90D9" opacity="0.05"/>
  <circle cx="1130" cy="360" r="300" fill="#9B59D0" opacity="0.05"/>

  <!-- faded editor rows behind the card -->
  <g opacity="0.55">
    <rect x="46" y="52"  width="150" height="26" rx="8" fill="#E4EAF2"/>
    <rect x="46" y="104" width="96"  height="26" rx="8" fill="#E4EAF2"/>
    <rect x="46" y="156" width="176" height="26" rx="8" fill="#E4EAF2"/>
    <rect x="46" y="208" width="120" height="26" rx="8" fill="#E4EAF2"/>
    <rect x="46" y="260" width="150" height="26" rx="8" fill="#E4EAF2"/>
    <rect x="46" y="312" width="104" height="26" rx="8" fill="#E4EAF2"/>
    <rect x="1004" y="52"  width="150" height="26" rx="8" fill="#E4EAF2"/>
    <rect x="1004" y="104" width="104" height="26" rx="8" fill="#E4EAF2"/>
    <rect x="1004" y="156" width="168" height="26" rx="8" fill="#E4EAF2"/>
    <rect x="1004" y="208" width="112" height="26" rx="8" fill="#E4EAF2"/>
    <rect x="1004" y="260" width="150" height="26" rx="8" fill="#E4EAF2"/>
    <rect x="1004" y="312" width="96"  height="26" rx="8" fill="#E4EAF2"/>
    <!-- gutter accents -->
    <rect x="24" y="52"  width="6" height="26" rx="3" fill="#4A90D9" opacity="0.45"/>
    <rect x="24" y="156" width="6" height="26" rx="3" fill="#9B59D0" opacity="0.45"/>
    <rect x="24" y="260" width="6" height="26" rx="3" fill="#E8923A" opacity="0.45"/>
    <rect x="1170" y="104" width="6" height="26" rx="3" fill="#9B59D0" opacity="0.45"/>
    <rect x="1170" y="208" width="6" height="26" rx="3" fill="#4A90D9" opacity="0.45"/>
    <rect x="1170" y="312" width="6" height="26" rx="3" fill="#E8923A" opacity="0.45"/>
  </g>

  <!-- center card -->
  <rect x="220" y="40" width="760" height="320" rx="24" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>

  <!-- subtle diff glyphs on the card -->
  <text x="252" y="86" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#4A90D9" opacity="0.35">+</text>
  <text x="936" y="86" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#9B59D0" opacity="0.35">+</text>
  <text x="252" y="330" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#94A3B8" opacity="0.35">−</text>
  <text x="936" y="330" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#94A3B8" opacity="0.35">−</text>

  <!-- merge mark: two lanes, one history -->
  <g>
    <!-- identity chips -->
    <rect x="498" y="58" width="60" height="26" rx="13" fill="url(#gBlue)" filter="url(#soft)"/>
    <text x="528" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1">YOU</text>
    <rect x="632" y="58" width="76" height="26" rx="13" fill="url(#gPurple)" filter="url(#soft)"/>
    <text x="670" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1">AGENT</text>

    <!-- lanes -->
    <path d="M 528 116 C 528 150, 568 158, 594 170" fill="none" stroke="url(#gBlue)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 672 116 C 672 150, 632 158, 606 170" fill="none" stroke="url(#gPurple)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="528" cy="106" r="11" fill="url(#gBlue)" filter="url(#soft)"/>
    <circle cx="528" cy="106" r="4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="672" cy="106" r="11" fill="url(#gPurple)" filter="url(#soft)"/>
    <circle cx="672" cy="106" r="4" fill="#FFFFFF" opacity="0.9"/>

    <!-- merge node -->
    <circle cx="600" cy="182" r="30" fill="url(#gOrange)" stroke="#FFFFFF" stroke-width="5" filter="url(#soft)"/>
    <circle cx="600" cy="182" r="12" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.95"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#0F172A" letter-spacing="4">PI-COEDIT</text>
  <rect x="572" y="312" width="56" height="6" rx="3" fill="url(#gOrange)"/>

  <!-- tagline -->
  <text x="600" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#64748B">Human vs AI edit accountability — live, before anyone commits</text>
</svg>
